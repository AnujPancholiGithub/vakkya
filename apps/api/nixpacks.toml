# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @vakkya/schemas build",
  "pnpm --filter @vakkya/api build"
]

[start]
cmd = "pnpm --filter @vakkya/api start"
