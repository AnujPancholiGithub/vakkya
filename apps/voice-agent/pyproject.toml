[project]
name = "vakkya-voice-agent"
version = "0.1.0"
description = "Real-time voice agent service for Vakkya using LiveKit Agents SDK"
requires-python = ">=3.12,<3.14"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.2",
    "asyncpg==0.29.0",
    "openai==1.54.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "structlog==24.1.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
    "hypothesis==6.92.0",
    "black==23.12.0",
    "ruff==0.1.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']
# TODO: Test with Python 3.14 when livekit-blingfire adds support

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
